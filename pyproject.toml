[project]
name = "breakout"
version = "0.1.0"
description = "Predict which young GitHub repositories are about to break out, from the public GH Archive event stream."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "db-dtypes>=1.7.2",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-bigquery-storage>=2.42.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
breakout = "breakout.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the audit report embeds wide markdown tables as string constants
"src/breakout/ingest/audit.py" = ["E501"]
"src/breakout/ingest/bq/report.py" = ["E501"]
"src/breakout/ops/capture_quality.py" = ["E501"]
# the baseline report is markdown assembled from long f-strings
"src/breakout/ml/baseline.py" = ["E501"]
"src/breakout/ml/cv_report.py" = ["E501"]
"src/breakout/ml/card.py" = ["E501"]
"src/breakout/ml/daily_check.py" = ["E501"]
# Phase 7: inline SQL and markdown report text
"src/breakout/features/*.py" = ["E501"]
"tests/features/*.py" = ["E501"]
# Phase 11: inline SQL and markdown suspicion report text
"src/breakout/detect/*.py" = ["E501"]
"src/breakout/publish/insights.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "pandas", "pandas.*", "scipy", "scipy.*", "shap", "shap.*", "lightgbm", "lightgbm.*"]
ignore_missing_imports = true
