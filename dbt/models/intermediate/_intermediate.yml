version: 2

models:
  - name: int_repo_star_daily
    description: >
      Grain (repo_id, day) over ALL repos: first-star counts. The only all-repo daily table; stars
      define candidates.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, day]}
    columns:
      - name: repo_id
        tests: [not_null]
      - name: day
        tests: [not_null]
      - name: n_stars
        tests: [not_null, {dbt_utils.expression_is_true: {arguments: {expression: "> 0"}}}]

  - name: int_star_active_repos
    description: >
      Prefilter (ADR-020): repos with >= min_stars_14d stars in a 14-day window while at most
      max_age_days + 2 days after their first star. Superset of young-and-moving; breaks the
      birth <-> young-moving cycle.
    columns:
      - name: repo_id
        tests: [not_null, unique]
      - name: first_star_day
        tests: [not_null]
      - name: first_qualifying_day
        tests: [not_null]

  - name: int_bot_event_counts
    description: Bot events per (repo_id, day) for star-active repos only, for mirror / bot-heavy repo detection (ADR-020).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, day]}
    columns:
      - name: repo_id
        tests: [not_null]
      - name: day
        tests: [not_null]
      - name: n_bot_events
        tests: [not_null]

  - name: int_active_repo_event_days
    description: Non-bot events per (repo_id, day) of all kept types for star-active repos, with earliest event time that day.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, day]}
    columns:
      - name: repo_id
        tests: [not_null]
      - name: n_events
        tests: [not_null]

  - name: int_repo_birth
    description: >
      Grain repo_id (star-active repos). birth_at = max(public time, COALESCE(API created_at,
      CreateEvent repository, first event)). first_event_at is left-censored at events_start:
      is_left_censored flags repos without an API date whose first event is within 30 days of it.
    columns:
      - name: repo_id
        tests: [not_null, unique]
      - name: birth_at
        tests: [not_null]
      - name: birth_source
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [api, create_event, first_event, public_event]}
      - name: is_fork
        tests: [not_null]
      - name: is_mirror_like
        tests: [not_null]
      - name: is_left_censored
        tests: [not_null]
    tests:
      - birth_not_after_first_star:
          arguments: {tolerance: 0.001}

  - name: int_young_moving_repos
    description: >
      Grain repo_id: repos that on some day d had age <= max_age_days and >= min_stars_14d stars in
      [d-14, d). Superset of candidates; all expensive downstream models are restricted to it.
    columns:
      - name: repo_id
        tests: [not_null, unique]
      - name: first_moving_day
        tests: [not_null]

  - name: int_early_stars
    description: >
      First stars on young-moving repos made before birth + max_age_days + 1 day (the only stars a
      candidate can see). Grain (repo_id, actor_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, actor_id]}
    columns:
      - name: repo_id
        tests: [not_null]
      - name: actor_id
        tests: [not_null]
      - name: starred_at
        tests: [not_null]

  - name: int_repo_daily_activity
    description: >
      Grain (repo_id, day) for young-moving repos. Detail-dependent counts (issues opened/closed,
      issue vs PR comments, PRs opened/closed/merged, branch/tag creates) are NULL before
      detail_start_date, never 0. n_distinct_actors is across all non-bot event types.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, day]}
    columns:
      - name: repo_id
        tests: [not_null]
      - name: day
        tests: [not_null]
      - name: n_stars
        tests: [not_null]
      - name: n_distinct_actors
        tests: [not_null]

  - name: int_actor_daily_activity
    description: >
      Grain (actor_id, day) for early stargazers of young-moving repos: n_events across all kept
      types incl. pushes, distinct repos, stars given. Limited to days from 91 days before the actor's
      first early star up to the day of their last.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [actor_id, day]}
    columns:
      - name: actor_id
        tests: [not_null]
      - name: n_events
        tests: [not_null]

  - name: int_actor_cumulative_activity
    description: Running totals per actor as of the end of each active day.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [actor_id, day]}
      - monotonic_cumulative:
          arguments: {partition_by: actor_id, order_by: day, columns: [cum_events, cum_repo_days, cum_stars_given]}
          config: {where: "actor_id % 97 = 0"}  # a window over all 430 M rows exceeds the spill cap; sample of actors
    columns:
      - name: actor_id
        tests: [not_null]

  - name: int_star_events_enriched
    description: >
      One row per early first star on a young-moving repo, with estimated account age and the actor's
      activity strictly before the star day (prior 90 days) plus stars given the same day.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, actor_id]}
    columns:
      - name: est_account_created_at
        tests: [not_null]
      - name: actor_events_prior_90d
        tests: [not_null, {dbt_utils.expression_is_true: {arguments: {expression: ">= 0"}}}]
      - name: actor_stars_same_day
        tests: [not_null]

  - name: int_contributor_first_seen
    description: First contribution (issue opened, comment, PR opened, review or push day) per (repo_id, actor_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, actor_id]}
    columns:
      - name: first_contribution_at
        tests: [not_null]
      - name: first_contribution_type
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [issue, issue_comment, pull_request, review, push]}

  - name: int_contributor_sessions
    description: Sessions of non-push human activity per (repo_id, actor_id), split by a gap of session_gap_minutes.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, actor_id, session_id]}
    columns:
      - name: session_start
        tests: [not_null]
      - name: session_end
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: ">= session_start"}
      - name: n_events
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments: {expression: ">= 1"}

  - name: int_core_actors_daily
    description: "Maintainer evidence per (repo_id, actor_id, day): pushed, closed a PR, or owner login equals actor login."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, actor_id, day]}
    columns:
      - name: pushed
        tests: [not_null]

  - name: int_issue_response
    description: Issues opened (detail eras), with first non-author response and close time.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, number]}
    columns:
      - name: opened_at
        tests: [not_null]
      - name: first_response_at
        tests:
          - dbt_utils.expression_is_true:
              arguments: {expression: "> opened_at"}
              config: {where: "first_response_at is not null"}

  - name: int_pr_lifecycle
    description: Pull requests opened (detail eras), with close, merge (when the flag exists) and first review times.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, number]}
    columns:
      - name: opened_at
        tests: [not_null]

  - name: int_stargazer_later_actions
    description: "Later actions (fork, issue, PR, comment) of early stargazers on the same repo within 90 days of the star."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, actor_id, action_event_id]}
    columns:
      - name: days_after_star
        tests: [{dbt_utils.expression_is_true: {arguments: {expression: "between 0 and 90"}}}]

  - name: int_star_cohort_retention
    description: >
      Weekly cohorts of early stargazers per young-moving repo and the share who later forked,
      opened an issue / PR or commented within 30/60/90 days. Use only rows where is_mature_Nd.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, cohort_week]}
    columns:
      - name: n_stargazers
        tests: [not_null, {dbt_utils.expression_is_true: {arguments: {expression: ">= 1"}}}]
      - name: share_any_90d
        tests: [{dbt_utils.expression_is_true: {arguments: {expression: "between 0 and 1"}}}]
