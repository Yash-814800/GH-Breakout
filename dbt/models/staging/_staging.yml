version: 2

# Uniqueness tests on event ids run on the most recent 90 days of the window (full-history
# uniqueness per month is enforced by `breakout lake verify --deep`; see ADR-020).

models:
  - name: stg_bot_actor_signals
    description: >
      Per (month, actor_id) bot evidence: a bot-like login and the number of days with > 1,000
      non-star events. Incremental, built month by month in bounded memory (ADR-020).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [month, actor_id]}
    columns:
      - name: month
        description: First day of the UTC month the evidence refers to.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: n_busy_days
        description: 'Number of UTC days in the month with more than 1,000 non-star events by the actor.'
        tests: [not_null]
      - name: bot_like_login
        description: 'A login the actor used in the month (the alphabetical maximum), kept so the login rules in stg_bot_actors can be applied.'

  - name: stg_bot_actors
    description: >
      Automation accounts (login ending in [bot] / -bot / _bot, the known_bots seed, or > 1,000
      non-star events on >= 3 UTC days). Heavy starrers are NOT classified here (Phase 11).
    columns:
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null, unique]
      - name: reason
        description: 'Why the actor is treated as automation: login pattern, known_bots seed or busy-day rule.'
        tests:
          - not_null
          - accepted_values:
              arguments: {values: [login_pattern, known_bots_seed, extreme_non_star_activity]}

  - name: stg_stars
    description: >
      First star per (repo_id, actor_id) from WatchEvent. Re-stars are dropped and unstars are
      invisible in GH Archive. Bot actors excluded. Materialised (incremental by repo_id hash
      bucket, ADR-020) because the global first-star window does not fit the memory cap otherwise.
    columns:
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: starred_at
        description: UTC timestamp of the first observed star.
        tests:
          - not_null
          - no_rows_outside_window
      - name: event_id
        description: GH Archive event id.
        tests:
          - not_null
          - unique:
              config: &recent {where: "starred_at >= timestamp '{{ var(\"events_end\") }}' - interval 90 day"}
      - name: bucket
        description: Hash bucket of repo_id (or actor_id) used to build the model in bounded memory (ADR-020); not meaningful downstream.
      - name: detail_level
        description: 0 or 1 as in the event spine; stars carry no payload fields either way.

  - name: stg_forks
    description: ForkEvent rows (non-bot). repo_id is the parent repository, forkee_repo_id the new fork.
    columns:
      - name: event_id
        description: GH Archive event id.
        tests: [not_null, {unique: {config: &recent_c {where: "created_at >= timestamp '{{ var(\"events_end\") }}' - interval 90 day"}}}]
      - name: created_at
        description: 'UTC time of the event (naive TIMESTAMP, ADR-005).'
        tests: [not_null, no_rows_outside_window]
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: forkee_repo_id
        description: NULL when the event carries no fork id.
      - name: repo_name
        description: 'Repository name (owner/name) at the time of the event. Display only, can change after a rename.'
      - name: actor_login
        description: Login of the actor at the time of the event. Display only.
      - name: detail_level
        description: '0 = spine columns only (BigQuery era), 1 = payload fields parsed (hourly era).'

  - name: stg_issues
    description: IssuesEvent rows (non-bot). action/number/target_* are NULL where detail_level = 0.
    columns:
      - name: event_id
        description: GH Archive event id.
        tests: [not_null, {unique: {config: *recent_c}}]
      - name: created_at
        description: 'UTC time of the event (naive TIMESTAMP, ADR-005).'
        tests: [not_null, no_rows_outside_window]
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: detail_level
        description: '0 = spine columns only (BigQuery era), 1 = payload fields parsed (hourly era).'
        tests: [{accepted_values: {arguments: {values: [0, 1], quote: false}}}]
      - name: action
        description: 'Event action from the payload (for example opened, closed). NULL where detail_level = 0.'
        tests:
          - accepted_values:
              arguments: {values: [opened, closed, reopened, edited, assigned, unassigned, labeled, unlabeled, deleted, transferred, pinned, unpinned, locked, unlocked, milestoned, demilestoned, typed, untyped, blocked, unblocked, sub_issue_added, sub_issue_removed, parent_issue_added, parent_issue_removed]}
              config: {severity: warn}
      - name: repo_name
        description: 'Repository name (owner/name) at the time of the event. Display only, can change after a rename.'
      - name: actor_login
        description: Login of the actor at the time of the event. Display only.
      - name: number
        description: Issue or pull request number within the repository. NULL where detail_level = 0.
      - name: target_user_id
        description: Id of the user who authored the issue or pull request the event refers to. NULL where unavailable.
      - name: target_created_at
        description: Creation time of the issue or pull request the event refers to. NULL where unavailable.

  - name: stg_issue_comments
    description: IssueCommentEvent rows (comments on issues and pull requests; non-bot).
    columns:
      - name: event_id
        description: GH Archive event id.
        tests: [not_null, {unique: {config: *recent_c}}]
      - name: created_at
        description: 'UTC time of the event (naive TIMESTAMP, ADR-005).'
        tests: [not_null, no_rows_outside_window]
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: is_pull_request
        description: NULL where detail_level = 0.
      - name: action
        description: 'Event action from the payload (for example opened, closed). NULL where detail_level = 0.'
        tests:
          - accepted_values:
              arguments: {values: [created, edited, deleted]}
              config: {severity: warn}
      - name: repo_name
        description: 'Repository name (owner/name) at the time of the event. Display only, can change after a rename.'
      - name: actor_login
        description: Login of the actor at the time of the event. Display only.
      - name: detail_level
        description: '0 = spine columns only (BigQuery era), 1 = payload fields parsed (hourly era).'
      - name: number
        description: Issue or pull request number within the repository. NULL where detail_level = 0.
      - name: target_user_id
        description: Id of the user who authored the issue or pull request the event refers to. NULL where unavailable.

  - name: stg_pull_requests
    description: >
      PullRequestEvent rows (non-bot). pr_merged only on `closed`; NULL after 2025-10-07 (ADR-007).
    columns:
      - name: event_id
        description: GH Archive event id.
        tests: [not_null, {unique: {config: *recent_c}}]
      - name: created_at
        description: 'UTC time of the event (naive TIMESTAMP, ADR-005).'
        tests: [not_null, no_rows_outside_window]
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: action
        description: 'Event action from the payload (for example opened, closed). NULL where detail_level = 0.'
        tests:
          - accepted_values:
              arguments: {values: [opened, closed, reopened, synchronize, edited, assigned, unassigned, labeled, unlabeled, review_requested, review_request_removed, ready_for_review, converted_to_draft, locked, unlocked, auto_merge_enabled, auto_merge_disabled, enqueued, dequeued, milestoned, demilestoned]}
              config: {severity: warn}
      - name: repo_name
        description: 'Repository name (owner/name) at the time of the event. Display only, can change after a rename.'
      - name: actor_login
        description: Login of the actor at the time of the event. Display only.
      - name: detail_level
        description: '0 = spine columns only (BigQuery era), 1 = payload fields parsed (hourly era).'
      - name: number
        description: Issue or pull request number within the repository. NULL where detail_level = 0.
      - name: pr_merged
        description: True when the closed pull request was merged. Only set on closed actions; NULL after 2025-10-07 (ADR-007).
      - name: target_user_id
        description: Id of the user who authored the issue or pull request the event refers to. NULL where unavailable.
      - name: target_created_at
        description: Creation time of the issue or pull request the event refers to. NULL where unavailable.

  - name: stg_pr_reviews
    description: PullRequestReviewEvent rows (non-bot); exist from 2020.
    columns:
      - name: event_id
        description: GH Archive event id.
        tests: [not_null, {unique: {config: *recent_c}}]
      - name: created_at
        description: 'UTC time of the event (naive TIMESTAMP, ADR-005).'
        tests: [not_null, no_rows_outside_window]
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: review_state
        description: 'State of the review (approved, changes_requested, commented). NULL where unavailable.'
        tests:
          - accepted_values:
              arguments: {values: [approved, changes_requested, commented, dismissed, pending]}
              config: {severity: warn}
      - name: repo_name
        description: 'Repository name (owner/name) at the time of the event. Display only, can change after a rename.'
      - name: actor_login
        description: Login of the actor at the time of the event. Display only.
      - name: detail_level
        description: '0 = spine columns only (BigQuery era), 1 = payload fields parsed (hourly era).'
      - name: action
        description: 'Event action from the payload (for example opened, closed). NULL where detail_level = 0.'
      - name: number
        description: Issue or pull request number within the repository. NULL where detail_level = 0.

  - name: stg_releases
    description: ReleaseEvent rows (non-bot).
    columns:
      - name: event_id
        description: GH Archive event id.
        tests: [not_null, {unique: {config: *recent_c}}]
      - name: created_at
        description: 'UTC time of the event (naive TIMESTAMP, ADR-005).'
        tests: [not_null, no_rows_outside_window]
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: action
        description: 'Event action from the payload (for example opened, closed). NULL where detail_level = 0.'
        tests:
          - accepted_values:
              arguments: {values: [published, created, edited, deleted, prereleased, released, unpublished]}
              config: {severity: warn}
      - name: repo_name
        description: 'Repository name (owner/name) at the time of the event. Display only, can change after a rename.'
      - name: actor_login
        description: Login of the actor at the time of the event. Display only.
      - name: detail_level
        description: '0 = spine columns only (BigQuery era), 1 = payload fields parsed (hourly era).'
      - name: release_prerelease
        description: True when the release is marked as a pre-release. NULL where detail_level = 0.

  - name: stg_creates
    description: CreateEvent rows (non-bot). ref_type is NULL where detail_level = 0.
    columns:
      - name: event_id
        description: GH Archive event id.
        tests: [not_null, {unique: {config: *recent_c}}]
      - name: created_at
        description: 'UTC time of the event (naive TIMESTAMP, ADR-005).'
        tests: [not_null, no_rows_outside_window]
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: ref_type
        description: 'What was created: repository, branch or tag. NULL where detail_level = 0.'
        tests:
          - accepted_values:
              arguments: {values: [repository, branch, tag]}
      - name: repo_name
        description: 'Repository name (owner/name) at the time of the event. Display only, can change after a rename.'
      - name: actor_login
        description: Login of the actor at the time of the event. Display only.
      - name: detail_level
        description: '0 = spine columns only (BigQuery era), 1 = payload fields parsed (hourly era).'

  - name: stg_public_events
    description: PublicEvent rows (repository made public; non-bot).
    columns:
      - name: event_id
        description: GH Archive event id.
        tests: [not_null, {unique: {config: *recent_c}}]
      - name: created_at
        description: 'UTC time of the event (naive TIMESTAMP, ADR-005).'
        tests: [not_null, no_rows_outside_window]
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: repo_name
        description: 'Repository name (owner/name) at the time of the event. Display only, can change after a rename.'
      - name: actor_login
        description: Login of the actor at the time of the event. Display only.
      - name: detail_level
        description: '0 = spine columns only (BigQuery era), 1 = payload fields parsed (hourly era).'

  - name: stg_push_daily
    description: Daily push counts per (repo_id, actor_id); PushEvent rows are not stored.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, actor_id, day]}
          config: {where: "day >= date '{{ var(\"events_end\") }}' - interval 90 day"}
    columns:
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: actor_id
        description: GitHub user id of the actor. The key for users; logins are display-only.
        tests: [not_null]
      - name: day
        description: UTC day of the pushes.
        tests: [not_null]
      - name: n_pushes
        description: Number of PushEvents by the actor to the repository on that day (the events themselves are not stored).
        tests: [not_null]

  - name: stg_repo_metadata
    description: >
      GitHub GraphQL metadata (Phase 4, trusted era). status 'not_found' = deleted/private/blocked:
      every other column is then NULL = UNKNOWN, not "false".
    columns:
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null, unique]
      - name: status
        description: 'ok when the GraphQL lookup returned the repository, not_found when it is deleted, private or blocked (all other columns are then NULL = unknown).'
        tests: [{accepted_values: {arguments: {values: [ok, not_found]}}}]
      - name: fetched_at
        description: UTC time of the lookup.
      - name: api_created_at
        description: 'createdAt from the GitHub API: a fact fixed at creation.'
      - name: is_fork
        description: 'True when the repository is a fork (isFork, fixed at creation).'
      - name: parent_repo_id
        description: Id of the parent repository for a fork.
      - name: is_archived
        description: True when the repository is archived at lookup time.
      - name: is_mirror
        description: True when the repository is a mirror.
      - name: is_template
        description: True when the repository is a template.
      - name: primary_language
        description: 'Primary language at lookup time (slowly varying, a documented exception in DECISIONS).'
      - name: owner_type
        description: 'User or Organization (slowly varying, a documented exception in DECISIONS).'
      - name: owner_id
        description: GitHub id of the owner.
      - name: owner_created_at
        description: Account creation time of the owner.

  - name: stg_repo_name_history
    description: (repo_id, repo_name) pairs seen on WatchEvents with first/last seen. Display only; never join events on names.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [repo_id, repo_name]}
    columns:
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
        tests: [not_null]
      - name: repo_name
        description: 'Repository name (owner/name) at the time of the event. Display only, can change after a rename.'
        tests: [not_null]
      - name: first_seen
        description: First time the name was seen on a WatchEvent.
      - name: last_seen
        description: Last time the name was seen on a WatchEvent.
      - name: n_events
        description: Number of WatchEvents that carried this name.

  - name: stg_actor_age_map
    description: Monotone breakpoints actor_id -> estimated account creation (isotonic fit, median error ~1.9 days).
    columns:
      - name: actor_id_breakpoint
        description: Actor id at a breakpoint of the monotone fit.
        tests: [not_null, unique]
      - name: est_created_at
        description: 'Estimated account creation time at that breakpoint (isotonic fit, median error about 1.9 days).'
        tests: [not_null]

  - name: stg_trending
    description: GitHub Trending history. language_filter IS NULL is the all-languages list.
    columns:
      - name: trending_date
        description: Day of the GitHub Trending snapshot.
        tests: [not_null]
      - name: rank
        description: Position on the list that day (1 = top).
        tests: [not_null]
      - name: repo_name
        description: Repository name shown on the list. Display only.
        tests: [not_null]
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
      - name: language_filter
        description: Language of the list; NULL for the all-languages list.
      - name: source
        description: Name of the dataset the row came from (for example hf_top_projects).

  - name: stg_hn_stories
    description: Hacker News stories linking to GitHub. points / num_comments are fetch-time values (ADR-019).
    columns:
      - name: story_id
        description: Hacker News story id.
        tests: [not_null, unique]
      - name: created_at
        description: 'UTC time of the event (naive TIMESTAMP, ADR-005).'
      - name: points
        description: 'Points at fetch time (not the value at story time, ADR-019).'
      - name: num_comments
        description: Comment count at fetch time (ADR-019).
      - name: repo_id
        description: GitHub repository id. The only key used to join repositories; names are display-only.
      - name: repo_name
        description: 'Repository name (owner/name) at the time of the event. Display only, can change after a rename.'
      - name: fetched_at
        description: UTC time the story was fetched.
