name: Monthly Maintenance

on:
  schedule:
    - cron: "29 4 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          echo "Disk before:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "Disk after:"
          df -h

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Actor-age map top-up
        env:
          GH_ENRICH_TOKEN: ${{ secrets.GH_ENRICH_TOKEN }}
        run: uv run breakout enrich actor-age || true

      - name: Refresh repository metadata for recent leaderboard repos
        env:
          GH_ENRICH_TOKEN: ${{ secrets.GH_ENRICH_TOKEN }}
        run: uv run breakout enrich repos || true

      - name: Upload enriched datasets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
        run: uv run breakout enrich upload || true

      - name: Verify Hugging Face lake integrity
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
        run: uv run breakout lake verify

      - name: Report storage and catalog summary
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
        run: uv run breakout lake catalog || true
