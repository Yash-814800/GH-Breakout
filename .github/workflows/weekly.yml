name: Weekly Retraining

on:
  schedule:
    - cron: "41 5 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        run: |
          echo "Disk before:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "Disk after:"
          df -h

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pull training rows, labels, live features and registry
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
        run: uv run breakout ops bootstrap-weekly

      - name: Append newly matured live training rows
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
        run: uv run breakout ml append-live-training --upload

      - name: Train candidate model
        run: uv run breakout ml train-final --candidate

      - name: Champion / challenger promotion
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
        run: uv run breakout ml promote --if-better --upload

      - name: Compute feature drift report
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
        run: uv run breakout ops drift --upload

      - name: Build similarity reference index
        run: uv run breakout detect similarity-reference

      # Phase 12: the digest is built from frozen snapshots and outcomes. Neither step may fail the retrain.
      - name: Weekly digest
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
        run: uv run breakout publish digest --upload

      - name: Post the digest to GitHub Discussions
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run breakout publish discuss-digest --repo "$GITHUB_REPOSITORY"

      - name: Commit retraining reports and model updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/retrain/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(ml): weekly model retraining and drift report"
            git pull --rebase
            git push
          else
            echo "No retraining reports or registry changes to commit."
          fi
