name: Update visual snapshots

# Regenerates the Playwright screenshots in the same container CI uses and opens a pull request with them.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshots:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Mark the workspace as safe for git inside the container
        working-directory: .
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Fixture data (served as static files) and figures
        working-directory: .
        run: |
          mkdir -p site/public/data site/public/figures
          cp -r site/test-data/* site/public/data/
          cp reports/figures/*.png site/public/figures/ || true
      - run: npm ci
      - run: npm run build:fx
      - run: npx playwright test tests/visual.spec.ts --update-snapshots
        env:
          CI: "1"
      - name: Open a pull request with the new snapshots
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: .
          branch: chore/update-visual-snapshots
          commit-message: "test(site): update visual snapshots"
          title: "test(site): update visual snapshots"
          body: |
            Regenerated by the `update-visual-snapshots` workflow in the pinned Playwright container.
            Review the changed images before merging.
          add-paths: site/tests/__screenshots__
