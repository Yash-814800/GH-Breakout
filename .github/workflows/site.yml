name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/model_card.md"
      - "dbt/**"
      - "reports/dbt/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Pull site data and digests from Hugging Face
        env:
          HF_USER: ${{ vars.HF_USER }}
        run: |
          mkdir -p site/public/data
          # Fixtures are only a fallback for a failed pull: they must never mix with real data
          # (fixture digests or feed items would be published as real ones).
          uv run python -c "
          from huggingface_hub import snapshot_download
          import os, shutil
          from pathlib import Path

          user = os.environ.get('HF_USER', 'Yasshh814')
          repo = f'{user}/gh-breakout-derived'
          dst = Path('site/public/data')
          try:
              snapshot_download(repo_id=repo, repo_type='dataset', allow_patterns=['site_data/latest/*', 'digests/*'], local_dir='hf_site')
              src = Path('hf_site/site_data/latest')
              if not (src / 'leaderboard.json').exists():
                  raise FileNotFoundError('no published site data')
              shutil.copytree(src, dst, dirs_exist_ok=True)
              if Path('hf_site/digests').exists():
                  shutil.copytree('hf_site/digests', dst / 'digests', dirs_exist_ok=True)
              print('Pulled the latest site data and digests from HF')
          except Exception as exc:
              print(f'Using the fixture data as fallback: {exc}')
              shutil.copytree('site/test-data', dst, dirs_exist_ok=True)
          "

      - name: Build badges from the frozen snapshots
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
        run: uv run breakout publish badges || echo "::warning::badges not built"

      # Phase 13: lineage and column docs of the dbt project (no warehouse needed; column types come
      # from the committed reports/dbt/catalog.json). Failure keeps the site without the docs link target.
      - name: dbt docs
        run: uv run breakout publish dbt-docs || echo "::warning::dbt docs not built"

      - name: Copy figures to site
        run: |
          mkdir -p site/public/figures
          cp reports/figures/*.png site/public/figures/ || true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build Astro site
        run: |
          cd site
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
