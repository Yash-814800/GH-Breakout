name: Daily Pipeline

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot date (YYYY-MM-DD), default: today UTC"
        required: false
        type: string
      skip_deploy:
        description: "Skip deploying site data"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free disk space
        run: |
          echo "Disk before:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "Disk after:"
          df -h

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run daily pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ vars.HF_USER }}
          GH_ENRICH_TOKEN: ${{ secrets.GH_ENRICH_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          if [ "${{ inputs.skip_deploy }}" = "true" ]; then
            ARGS="$ARGS --skip-deploy-data"
          fi
          uv run breakout daily run $ARGS

      - name: Build dbt docs
        continue-on-error: true
        run: uv run breakout publish dbt-docs

      - name: Upload run status and logs artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-run-status-${{ inputs.date || 'today' }}
          path: |
            data/run/status.json
            status/heartbeat.json
          retention-days: 14

      - name: Upload site data artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-data
          path: site/public/data/
          retention-days: 7

      - name: Upload dbt docs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-dbt-docs
          path: site/public/dbt-docs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload badges artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-badges
          path: site/public/badges/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: pipeline
    if: inputs.skip_deploy != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download site data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-data
          path: site/public/data

      - name: Download dbt docs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: site-dbt-docs
          path: site/public/dbt-docs

      - name: Download badges artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: site-badges
          path: site/public/badges

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Copy figures to site
        run: |
          mkdir -p site/public/figures
          cp reports/figures/*.png site/public/figures/ || true

      - name: Build site
        run: |
          cd site
          npm ci
          npm run build

      # Phase 14: check the real data before publishing. A failure keeps yesterday's site and logs a warning.
      - name: Content check on real data
        id: qa
        continue-on-error: true
        run: |
          cd site
          npx playwright install --with-deps chromium
          QA_DATA_DIR=public/data E2E_OUT=dist npx playwright test tests/content.spec.ts

      - name: Warn when the content check failed
        if: steps.qa.outcome == 'failure'
        run: |
          echo "::warning::Content check failed on today's data; the deploy was skipped and yesterday's site stays up."
          echo "### Site deploy skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The content check found raw values or console errors in today's build. Yesterday's site is still live." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: steps.qa.outcome == 'success'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.qa.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
