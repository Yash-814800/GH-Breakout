    group: detail
    tier: B
    dtype: float
    unit: hours
    description: Median hours to the first non-author comment, over issues opened in the last 28 days and answered
      before D
    allowed: true
    leakage_notes: first_response_at < D
    live_available: true
    requires:
    - type: IssueCommentEvent
      column: is_pull_request
    explain_template:
      high: issues get a first reply within {value} hours
      low: issues wait long for a reply
  share_issues_responded_48h:
    group: detail
    tier: B
    dtype: float
    unit: share
    description: 'Of issues opened in [D-28, D-2): share answered within 48 hours (and before D)'
    allowed: true
    leakage_notes: first_response_at < D
    live_available: true
    requires:
    - type: IssueCommentEvent
      column: is_pull_request
    explain_template:
      high: '{pct} of issues get an answer within two days'
      low: most issues get no quick answer
  prs_opened_28d:
    group: detail
    tier: B
    dtype: int
    unit: PRs
    description: Pull requests opened in the last 28 days
    allowed: true
    leakage_notes: day < D
    live_available: true
    requires:
    - type: PullRequestEvent
      column: action
    explain_template:
      high: '{value} pull requests opened in four weeks'
      low: no pull requests
  prs_merged_28d:
    group: detail
    tier: B
    dtype: int
    unit: PRs
    description: 'Pull requests merged in the last 28 days (NULL from payload_trim_date: merged flag removed)'
    allowed: true
    leakage_notes: day < D
    live_available: false
    requires:
    - type: PullRequestEvent
      column: pr_merged
    explain_template:
      high: '{value} pull requests merged in four weeks'
      low: no merged pull requests
  median_merge_hours_28d:
    group: detail
    tier: B
    dtype: float
    unit: hours
    description: Median hours from opening to merge of PRs merged in the last 28 days (NULL from payload_trim_date)
    allowed: true
    leakage_notes: merged_at < D
    live_available: false
    requires:
    - type: PullRequestEvent
      column: pr_merged
    explain_template:
      high: pull requests are merged within {value} hours
      low: pull requests wait long to be merged
  core_actor_count_90d:
    group: detail
    tier: B
    dtype: int
    unit: actors
    description: Distinct actors with maintainer evidence (push, PR close, owner) in the last 90 days
    allowed: true
    leakage_notes: day < D
    live_available: true
    requires:
    - type: PushEvent
      column: actor_id
    explain_template:
      high: '{value} maintainers are active'
      low: a single maintainer
  external_pr_authors_28d:
    group: detail
    tier: B
    dtype: int
    unit: actors
    description: Distinct PR openers in the last 28 days who are not core actors
    allowed: true
    leakage_notes: opened_at < D
    live_available: true
    requires:
    - type: PullRequestEvent
      column: action
    explain_template:
      high: '{value} outside contributors opened pull requests'
      low: no outside contributors
  tags_created_total_before:
    group: detail
    tier: B
    dtype: int
    unit: tags
    description: Tags created since the detail era began, before D
    allowed: true
    leakage_notes: day < D
    live_available: true
    requires:
    - type: CreateEvent
      column: ref_type
    explain_template:
      high: '{value} tags created'
      low: no tags created
  era_post_2025_10:
    group: detail
    tier: B
    dtype: int
    unit: flag
    description: 1 if D is on or after the Events API payload trim (2025-10-07); constant 0 in every training row
    allowed: false
    leakage_notes: calendar; constant 0 in every training row, so allowed is false
    live_available: false
    requires:
    - type: WatchEvent
      column: created_at
    explain_template:
      high: snapshot is after the payload trim
      low: snapshot is before the payload trim
  primary_language:
    group: enrich
    tier: C
    dtype: category
    unit: language
    description: Primary language (top 30 by frequency else Other; Unknown if missing). Slowly-varying documented
      exception (ADR-017)
    allowed: true
    leakage_notes: slowly varying exception, ADR-017
    live_available: true
    requires: []
    explain_template:
      high: written in {value}
      low: language unknown
  owner_type:
    group: enrich
    tier: C
    dtype: category
    unit: type
    description: User / Organization / Unknown. Slowly-varying documented exception (ADR-017)
    allowed: true
    leakage_notes: slowly varying exception, ADR-017
    live_available: true
    requires: []
    explain_template:
      high: owned by {value}
      low: owner type unknown
  birth_from_public_event:
    group: enrich
    tier: C
    dtype: int
    unit: flag
    description: 1 if the repo's birth is a PublicEvent (made public) rather than creation
    allowed: true
    leakage_notes: event time <= first star
    live_available: true
    requires:
    - type: PublicEvent
      column: created_at
    explain_template:
      high: was made public rather than created
      low: was created as a public repo
  days_api_created_to_birth:
    group: enrich
    tier: C
    dtype: int
    unit: days
    description: Days between the API creation date (fixed) and birth_at; > 0 for repos made public later
    allowed: true
    leakage_notes: created_at is fixed at creation
    live_available: true
    requires: []
    explain_template:
      high: existed privately for {value} days before going public
      low: was public from the start
  hn_stories_before_14d:
    group: enrich
    tier: C
    dtype: int
    unit: stories
    description: Hacker News stories linking to the repo created in the last 14 days (NULL if HN disabled)
    allowed: true
    leakage_notes: story created_at < D
    live_available: true
    requires: []
    explain_template:
      high: '{value} Hacker News stories in two weeks'
      low: not on Hacker News
  hn_stories_before_3d:
    group: enrich
    tier: C
    dtype: int
    unit: stories
    description: Hacker News stories created in the last 3 days
    allowed: true
    leakage_notes: story created_at < D
    live_available: true
    requires: []
    explain_template:
      high: was on Hacker News in the last 3 days
      low: not on Hacker News recently
  hn_max_points_aged:
    group: enrich
    tier: C
    dtype: int
    unit: points
    description: Max HN points among stories created in [D-30, D-3) (fetch-time points, aged >= 3 days, ADR-019)
    allowed: true
    leakage_notes: story created_at < D - 3 days
    live_available: true
    requires: []
    explain_template:
      high: a Hacker News post reached {value} points
      low: no notable Hacker News post
  hn_any_before:
    group: enrich
    tier: C
    dtype: int
    unit: flag
    description: 1 if any Hacker News story linked to the repo before D
    allowed: true
    leakage_notes: story created_at < D
    live_available: true
    requires: []
    explain_template:
      high: has been on Hacker News
      low: has not been on Hacker News

# Phase 4 enrichment columns (ADR-017). `model_feature: true` marks the only columns the model may
# read; everything else is display-only or a join key. Never use anything fetched "as of now" that
# changes over time (CLAUDE.md section 6). Tests in tests/enrich enforce this allow-list.
enrichment_columns:
  repo_metadata:
    repo_id:                  {model_feature: false, note: "join key"}
    created_at:               {model_feature: true,  kind: fixed, note: "true creation time; birth in Phase 6 also uses PublicEvent"}
    is_fork:                  {model_feature: true,  kind: fixed}
    primary_language:         {model_feature: true,  kind: slowly_varying_exception, adr: ADR-017}
    owner_type:               {model_feature: true,  kind: slowly_varying_exception, adr: ADR-017}
    parent_repo_id:           {model_feature: false, note: "fixed at fork time; fork repos are excluded by candidates.exclude_forks"}
    owner_id:                 {model_feature: false, note: "join key (bot/ownership lists)"}
    owner_login:              {model_feature: false, note: "display only"}
    owner_created_at:         {model_feature: false, note: "owner account age; candidate for a later documented exception"}
    name_with_owner:          {model_feature: false, note: "display only, never a key"}
    is_archived:              {model_feature: false, note: "current state; display only"}
    is_mirror:                {model_feature: false, note: "current state; display only"}
    is_template:              {model_feature: false, note: "current state; display only"}
    license_spdx:             {model_feature: false, note: "current state; display only"}
    description:              {model_feature: false, note: "current state; display only"}
    homepage_url:             {model_feature: false, note: "current state; display only"}
    topics:                   {model_feature: false, note: "current state; display only"}
    stargazer_count_at_fetch: {model_feature: false, note: "outcome-contaminated; only used by the live API cross-check (ADR-010)"}
    status:                   {model_feature: false, note: "not_found rows are kept to avoid survivorship bias"}
    source:                   {model_feature: false}
    fetched_at:               {model_feature: false}
  actor_age:
    est_account_created_at:   {model_feature: true,  kind: derived_from_id, note: "isotonic id -> creation date; no leakage (ids are immutable)"}
    est_is_extrapolated:      {model_feature: true,  kind: derived_from_id}
  hn_stories:
    story_count_before_D:     {model_feature: true,  note: "count of stories with created_at < D"}
    points_before_D_minus_3d: {model_feature: true,  note: "points only for stories created before D-3 days; values are final-at-fetch, ADR-019"}
    num_comments:             {model_feature: false, note: "same approximation as points; only via D-3d rule"}
  trending:
    any:                      {model_feature: false, note: "lead-time metric and display only; trending is not a predictor of itself"}
